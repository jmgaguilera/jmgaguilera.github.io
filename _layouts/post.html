---
layout: default
---
<div class="post">

  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    <p class="post-meta">{{ page.date | date: "%b %-d, %Y" }}{% if page.author %} • {{ page.author }}{% endif %}{% if page.meta %} • {{ page.meta }}{% endif %}</p>
  </header>

  <article class="post-content">
    {{ content }}
  </article>

</div>

{% assign comments = site.t[page.lang].comments %}
<section class="post-comments" aria-label="{{ comments.title }}">
  <button type="button" class="post-comments-button" aria-controls="disqus_thread" data-comments-button hidden>{{ comments.button }}</button>
  <p class="post-comments-status" role="status" data-comments-status
     data-loading="{{ comments.loading }}" data-error="{{ comments.error }}"></p>
  <noscript>{{ comments.no_script }}</noscript>
  <div id="disqus_thread" tabindex="-1" data-page-url="{{ page.url | absolute_url | escape }}"
       data-page-id="{{ page.id | escape }}" data-page-language="{{ page.lang }}"></div>
</section>
<script type="module" src="{{ '/js/comments.js' | relative_url }}"></script>
