<!DOCTYPE html>
<html lang="{{ page.lang | default: 'es' }}">
  {% assign translations = empty %}
  {% if page.ref %}
    {% assign translations = site.posts | concat: site.pages | where: 'ref', page.ref | sort: 'lang' %}
  {% endif %}
  {% include head.html %}

  <body class="fadein">
    <a class="site-skip-link" href="#contenido">{{ site.t[page.lang].skip }}</a>
    {% include header.html %}

    <main class="page-content" id="contenido" tabindex="-1">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>

    {% include footer.html %}

    <script type="module" src="{{ '/js/site-navigation.js' | relative_url }}"></script>
  </body>
</html>
